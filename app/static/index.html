<!DOCTYPE html>
<html>
<head>
    <title>Mon LLM local</title>
    <style>
        body {
            font-family: Arial;
            max-width: 800px;
            margin: auto;
        }

        textarea {
            width: 100%;
            height: 80px;
        }

        #answer {
            white-space: pre-wrap;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>Mon LLM local</h1>

<textarea id="message"
placeholder="Pose ta question..."></textarea>

<button onclick="send()">
Envoyer
</button>

<div id="answer"></div>


<script>

async function send(){

    let message =
        document.getElementById("message").value;

    let answer =
        document.getElementById("answer");

    answer.innerText = "";


    let response =
        await fetch("/chat", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:message
            })
        });


    const reader =
        response.body.getReader();


    const decoder =
        new TextDecoder();


    while(true){

        const {done, value} =
            await reader.read();


        if(done)
            break;


        answer.innerText +=
            decoder.decode(value);
    }
}

</script>

</body>
</html>
